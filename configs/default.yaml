# All tunable parameters live here (README: Engineering conventions).
paths:
  data: data/coco
  cache: cache
  results: results
  vocab: data/vocab         # downloaded label lists (Open Images, Places365)
  holidays: data/holidays   # INRIA Holidays: jpg/ + the downloaded archives
  revisited: data/datasets  # ROxford5k / RParis6k (supplementary run)
  revisitop: third_party/revisitop/python   # official revisitop evaluation code
  phone: data/phone         # the ~100 phone photos for the user study

data:
  gallery_size: 2000        # README target: 40000
  semantic_queries: 200     # README target: 1000
  similar_queries: 200      # README target: 1000
  seed: 27

holidays:                  # README: Holidays photos merged into the gallery (similar task)
  merge: true              # add them to gallery.json when downloaded

integrity:                 # expected dataset sizes, checked by scripts/check_data.py
  coco_images: {train2017: 118287, val2017: 5000}
  coco_categories: 80
  holidays: {images: 1491, queries: 500}
  revisited: {roxford5k: [4993, 70], rparis6k: [6322, 70]}   # [gallery, queries]

box_queries:               # intent disambiguation: crop a semantic query to one object
  min_categories: 2        # only queries with at least this many categories
  min_area_frac: 0.05      # the object box covers at least this share of the image
  pad_frac: 0.1            # box padding on each side, as a share of the box size

models:
  device: auto              # embedding device; search always runs on CPU
  clip:
    arch: ViT-B-32
    pretrained: laion2b_s34b_b79k
  siglip:                   # second semantic model to compare against CLIP
    arch: ViT-B-16-SigLIP
    pretrained: webli
  dinov2:
    timm_name: vit_small_patch14_dinov2.lvd142m
    image_size: 224
  phash:
    hash_size: 8            # 8x8 = 64-bit hash

embed:
  batch_size: 32

preprocess:
  max_side: 512

tasks:
  semantic:
    representation: fusion
    allowed: [clip, siglip, dinov2, phash, tags, fusion, tags_nococo, fusion_nococo]
  similar:
    representation: dinov2
    allowed: [clip, siglip, dinov2, phash]

fusion:                    # RRF of the clip kNN line and the tag BM25 line
  rrf_k: 60
  depth: 100               # candidates taken from each line

user:                      # demo photos added to the gallery
  dir: data/user
  first_id: 1000000000

search:
  k: 10
  eval_depth: 100

index:                     # scripts/04_build_index.py --index flat cluster ivfpq hnsw
  cluster:                 # HW2 cluster pruning (IIR 7.1.6)
    leaders: null          # null = round(sqrt(N)) random leaders
    b1: 1                  # each vector joins its b1 nearest leaders
    b2: 4                  # a query scans the followers of its b2 nearest leaders
  ivfpq:
    nlist: null            # null = round(sqrt(N))
    m: 32                  # sub-quantizers; divides 384 (DINOv2-S), 512 (CLIP B/32), 768 (SigLIP B/16)
    nbits: 8
    nprobe: 8
  hnsw:
    m: 32
    ef_construction: 200
    ef_search: 128

rerank:                    # SearchRequest.rerank; works on clip / siglip / dinov2 / fusion*
  aqe:                     # alpha-QE: q' = norm(q + sum_{i<n} max(s_i, 0)^alpha x_i)
    n: 3
    alpha: 3.0
  rocchio:                 # q' = norm(alpha q + beta mean(rel) - gamma mean(nonrel))
    alpha: 1.0
    beta: 0.75
    gamma: 0.15
    feedback_depth: 10     # evaluation: simulated user judges the top 10 (frozen ranking)
  mmr:
    lambda: 0.7            # 1.0 = relevance only; lower = more diversity
    depth: 100             # only the top `depth` results are re-ordered

eval:
  semantic_binary_threshold: 0.5   # gain >= this counts as relevant for mAP
  # scripts/05_evaluate.py --experiments: the planned experiments beyond the cross table
  # (label = representation[@index][+reranker...], see src/evaluate.py)
  experiments:
    semantic: [fusion+aqe, fusion+mmr, fusion+rocchio, fusion+aqe+mmr, clip+aqe, clip+rocchio,
               siglip+aqe, clip@cluster, clip@ivfpq, clip@hnsw, siglip@cluster, siglip@ivfpq,
               siglip@hnsw, fusion@hnsw]
    box: [fusion+mmr, clip+mmr]
    box_full: [fusion+mmr, clip+mmr]
    similar: [dinov2+aqe, dinov2+rocchio, dinov2@cluster, dinov2@ivfpq, dinov2@hnsw]
    holidays: [dinov2+aqe, dinov2+rocchio, dinov2@hnsw]

edits:
  crop_frac: 0.7
  rotate_deg: 15
  hue_shift: 0.08
  saturation: 1.5
  jpeg_quality: 20
  blur_radius: 2.0

bm25:                      # HW2 weighting.py Okapi BM25
  k1: 1.2
  b: 0.75

tags:                      # CLIP zero-shot tags -> HW1 inverted index
  vocabularies: [coco, openimages, places365]
  prompts: ["a photo of a {}."]
  top_n: 15
  tf_max: 5                # tf = 1 + round((tf_max - 1) * p / p_top1)
  logit_scale: 100         # softmax(logit_scale * cosine)
  variants:                # cache name -> sources whose only-from terms are dropped
    tags: []
    tags_nococo: [coco]

judging:                   # scripts/07_judging.py: pooled human judgments of the phone photos
  systems: [fusion, clip, siglip, dinov2, tags]   # pooled configurations (labels as in eval)
  pool_depth: 10           # top results of each system that enter the pool
  judges: [judge_a, judge_b]
  grades: [0, 1, 2]        # 0 not relevant, 1 partly relevant, 2 relevant
  aggregate: min           # combine the two judges: min / max / mean (rounded half up)

roxford:                   # scripts/08_roxford.py: supplementary ROxford5k / RParis6k run
  datasets: [roxford5k, rparis6k]
  models: [clip, siglip, dinov2, phash]
  mp_ks: [1, 5, 10]

demo:                      # app/app.py (Gradio)
  host: 127.0.0.1
  port: 7860
  hard_queries: 20         # lowest-AP semantic queries listed in the panel

pairs:                     # same-subject photo pairs (scripts/06_pairs.py)
  dir: data/pairs          # <name>/gallery.<ext> + <name>/query.<ext>
  synthetic: 10            # synthetic pairs made from COCO val2017 non-query images
  synthetic_edit:          # combined strong edit applied to make the query photo
    edits: [crop, rotation, color, jpeg]
    crop_frac: 0.6
    rotate_deg: 15
    hue_shift: 0.08
    saturation: 1.5
    jpeg_quality: 20
