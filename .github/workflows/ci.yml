name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # the team works on Windows and on a Linux server: line endings, encodings and path
    # separators break on only one of them, so both run
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GRADIO_ANALYTICS_ENABLED: "False"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      # files no test imports (scripts, the model-loading code) at least have to compile
      - name: Syntax check
        run: python -m compileall -q app scripts src tests

      - name: Unit tests
        run: python -m pytest -q -m "not models and not smoke"

      # 01 download -> integrity check -> 02 embed -> 03 tag -> 04 every index -> 05 evaluate
      # -> 06 pairs -> 07 judging -> check_data -> demo, on fake data from a local HTTP server
      - name: Smoke test and data integrity check
        run: python -m pytest -q -m smoke
