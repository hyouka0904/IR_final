[project]
name = "zero-shot-image-search"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["models: needs pretrained weights (downloads on first run)",
           "smoke: the numbered scripts end to end on fake data (no network, GPU or weights)"]
